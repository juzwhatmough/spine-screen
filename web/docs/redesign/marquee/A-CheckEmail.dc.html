<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee check your email</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2B83B}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0D1020; color: #F4F1EA; font-family: Inter, system-ui, sans-serif; box-sizing: border-box">

  <div aria-hidden="true" style="display: flex; justify-content: space-between; padding: 18px 22px 0">
    <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="14">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: {{b.c}}; box-shadow: {{b.glow}}"></span>
    </sc-for>
  </div>

  <div style="padding: 18px 22px 0">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3050; background: #171B2E; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
  </div>

  <div style="display: flex; justify-content: center; margin-top: 70px">
    <div aria-hidden="true" style="width: 132px; height: 132px; border-radius: 66px; background: #171B2E; border: 1px solid #2A3050; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 14px rgba(242,184,59,0.06), 0 0 60px rgba(242,184,59,0.18)">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F2B83B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 6.5l8.5 6.5 8.5-6.5"></path></svg>
    </div>
  </div>

  <div style="padding: 40px 28px 0; text-align: center">
    <h1 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 44px; line-height: 0.98">CHECK YOUR EMAIL</h1>
    <p style="margin: 14px 0 0; font-size: 16px; line-height: 1.55; color: #A3A9C2">We sent a sign-in link to</p>
    <p style="margin: 4px 0 0; font-size: 16px; font-weight: 700; color: #F4F1EA">you@example.com</p>
    <p style="margin: 14px 0 0; font-size: 15px; line-height: 1.55; color: #A3A9C2">Tap the link on this device and you will land straight on your shelf.</p>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
    <a href="#" style="height: 56px; border-radius: 16px; background: #F2B83B; color: #0D1020; font: 700 16px Inter, sans-serif; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
      Open email app</a>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <p style="margin: 0; font-size: 14px; color: #A3A9C2">Nothing yet? Resend in 0:42</p>
      <a href="#" style="padding: 12px 0; font-size: 14px; font-weight: 600; text-decoration: none">Use a different email</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const gold = '#F2B83B';
    const bulbs = Array.from({ length: 14 }, (_, i) => {
      const on = i % 3 !== 1;
      return { c: on ? gold : '#4A3F25', glow: on ? '0 0 8px ' + gold : 'none' };
    });
    return { bulbs };
  }
}
</script>
</body>
</html>
