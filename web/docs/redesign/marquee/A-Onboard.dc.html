<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee Shows onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2B83B}a:hover{color:#FFD27A}
input::placeholder{color:#7F86A3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0D1020; color: #F4F1EA; font-family: Inter, system-ui, sans-serif; box-sizing: border-box">

  <div aria-hidden="true" style="display: flex; justify-content: space-between; padding: 18px 22px 0">
    <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="14">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: {{b.c}}; box-shadow: {{b.glow}}"></span>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 0">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3050; background: #171B2E; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div aria-label="Step 2 of 3" style="display: flex; gap: 6px">
      <span style="width: 22px; height: 6px; border-radius: 3px; background: {{gold}}"></span>
      <span style="width: 22px; height: 6px; border-radius: 3px; background: {{gold}}"></span>
      <span style="width: 22px; height: 6px; border-radius: 3px; background: #2A3050"></span>
    </div>
    <a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 12px 0">Skip</a>
  </div>

  <div style="padding: 22px 22px 0">
    <p style="margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: {{gold}}">BUILD YOUR WATCHLIST</p>
    <h1 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 44px; line-height: 0.98">WHERE DO YOU WATCH?</h1>
    <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: #A3A9C2">Pick your services once. Recommendations only show what you can actually stream.</p>
  </div>

  <div style="padding: 24px 22px 0; display: flex; flex-direction: column; gap: 8px">
    <label for="a-country" style="font-size: 13px; font-weight: 600; color: #F4F1EA">Country</label>
    <div style="position: relative">
      <input id="a-country" value="Australia" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 44px 0 16px; border-radius: 14px; border: 1px solid #2A3050; background: #171B2E; color: #F4F1EA; font: 500 15px Inter, sans-serif">
      <svg aria-hidden="true" style="position: absolute; right: 16px; top: 16px; color: #A3A9C2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </div>

  <fieldset style="margin: 0; border: 0; padding: 22px 22px 0">
    <legend style="padding: 0; font-size: 13px; font-weight: 600; color: #F4F1EA">Streaming services <span style="font-weight: 500; color: #A3A9C2">· 3 selected</span></legend>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
      <sc-for list="{{services}}" as="s" hint-placeholder-count="10">
        <button aria-pressed="{{s.pressed}}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font: 600 14px Inter, sans-serif; display: flex; align-items: center; gap: 6px; cursor: pointer">
          <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </sc-if>
          {{s.label}}
        </button>
      </sc-for>
      <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px dashed #4A5280; background: transparent; color: #F4F1EA; font: 600 14px Inter, sans-serif; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Other
      </button>
    </div>
  </fieldset>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 22px 30px; background: linear-gradient(to top, #0D1020 70%, rgba(13,16,32,0))">
    <button style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: {{gold}}; color: #0D1020; font: 700 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 10px 30px rgba(242,184,59,0.3)">
      Next: shows you love
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"gold":{"editor":"color","default":"#F2B83B","options":["#F2B83B","#FF6B57","#8EC5FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const gold = this.props.gold ?? '#F2B83B';
    const bulbs = Array.from({ length: 14 }, (_, i) => {
      const on = i % 3 !== 1;
      return { c: on ? gold : '#4A3F25', glow: on ? '0 0 8px ' + gold : 'none' };
    });
    const picked = ['Netflix', 'Stan', 'Binge'];
    const services = ['Netflix', 'Disney+', 'Prime Video', 'Apple TV+', 'Max', 'Paramount+', 'Stan', 'Binge', 'Hulu', 'Peacock'].map(label => {
      const on = picked.includes(label);
      return on
        ? { label, on, pressed: 'true', bg: gold, fg: '#0D1020', border: gold }
        : { label, on, pressed: 'false', bg: '#171B2E', fg: '#F4F1EA', border: '#2A3050' };
    });
    return { gold, bulbs, services };
  }
}
</script>
</body>
</html>
